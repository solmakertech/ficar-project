services:
  db:
    image: mariadb:11.7.2
    container_name: db_ficat
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: fichas_db
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev # ou Dockerfile para produção
    container_name: api_ficat
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://user:password@db:3306/fichas_db
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev # ou Dockerfile para produção
    container_name: web_ficat
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://backend-ficat.solmakertech.com.br
    volumes:
      - ./apps/web:/app/apps/web
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
